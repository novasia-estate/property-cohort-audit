name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  r:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - {os: ubuntu-latest, r: '4.4'}
          - {os: windows-latest, r: 'release'}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
      - run: R CMD build .
      - run: R CMD check --no-manual propertycohorts_1.0.0.tar.gz
      - run: R CMD INSTALL propertycohorts_1.0.0.tar.gz
      - run: Rscript examples/run.R
      - uses: actions/upload-artifact@v4
        with:
          name: cohort-report-${{ matrix.r }}
          path: |
            example-report
            propertycohorts_1.0.0.tar.gz
            propertycohorts.Rcheck/00check.log
